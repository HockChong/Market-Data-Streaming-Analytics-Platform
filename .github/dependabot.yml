version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only allow minor/patch bumps (e.g., v4.1 → v4.2, not v4 → v6)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only allow minor/patch bumps (e.g., 1.26 → 1.27, not 1.x → 2.x)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
